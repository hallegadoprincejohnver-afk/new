name: Probe Processor
on:
  push:
    paths:
      - ".github/workflows/probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check processor health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \\
            https://clear-processor-api.onrender.com/health
          echo
